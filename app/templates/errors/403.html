{% extends "base.html" %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="error-box text-center">
            <div class="error-code">403</div>
            <div class="error-icon"><i class="bi bi-shield-lock"></i></div>
            <h1 class="error-title">Access Forbidden</h1>
            <p class="error-text">
                You don't have permission to view this page.<br>
                This might be someone else's post or a restricted area.
            </p>
            <div class="error-actions">
                <a href="{{ url_for('main.home') }}" class="btn btn-primary-custom btn-lg me-3">
                    <i class="bi bi-house me-2"></i>Go Home
                </a>
                <button onclick="history.back()" class="btn btn-outline-custom btn-lg">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
