{% extends "base.html" %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="error-box text-center">
            <div class="error-code">500</div>
            <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
            <h1 class="error-title">Internal Server Error</h1>
            <p class="error-text">
                Something went wrong on our end.<br>
                We're working to fix it. Please try again later.
            </p>
            <div class="error-actions">
                <a href="{{ url_for('main.home') }}" class="btn btn-primary-custom btn-lg me-3">
                    <i class="bi bi-house me-2"></i>Go Home
                </a>
                <button onclick="location.reload()" class="btn btn-outline-custom btn-lg">
                    <i class="bi bi-arrow-clockwise me-2"></i>Retry
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
